<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Without SoftStop pressure climbs Happy to Churned; with SoftStop the same chaos hits a shared journal and customer pressure stays capped">
  <rect width="1280" height="640" fill="#0B0B0F"/>
  <text x="40" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#E8A317" letter-spacing="2">WHY SOFTSTOP</text>
  <text x="40" y="68" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F7F5F0">Many departments. Thousands of customers. One journal - or none.</text>
  <text x="40" y="96" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9A9AA2">Messages land, pressure climbs Happy ? Annoyed ? Frustrated ? Angry ? Churned. SoftStop caps what lands.</text>

