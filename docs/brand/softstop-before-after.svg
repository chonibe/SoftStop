  <rect x="790" y="134" width="44" height="8" rx="4" fill="#E8A317"/>
  <text x="812" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B0B0F">check</text>
  <path d="M860 140 H900" stroke="#A8A29A" stroke-width="2"/>
  <circle cx="930" cy="140" r="28" fill="#0B0B0F"/>
  <text x="930" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#F7F5F0">User</text>
  <text x="700" y="280" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#047857">Only allowed escalations pass</text>
