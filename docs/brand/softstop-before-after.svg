<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="SoftStop use case: many systems escalate one user">
  <rect width="1200" height="520" fill="#F7F5F0"/>
  <text x="48" y="40" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#E8A317" letter-spacing="1">USE CASE</text>
  <text x="48" y="72" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B0B0F">Many systems escalate the same person</text>
  <text x="48" y="102" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#57534E">SoftStop is the shared permit before pressure rises — not the messaging tool.</text>

  <!-- Without -->
  <text x="48" y="160" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B0B0F">Without SoftStop</text>
  <text x="48" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#78716C">Each system fires on its own</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#44403C">
    <rect x="48" y="200" width="240" height="40" rx="8" fill="#fff" stroke="#D6D3D1"/>
    <text x="60" y="225">Lifecycle email · urgency</text>
    <rect x="48" y="250" width="240" height="40" rx="8" fill="#fff" stroke="#D6D3D1"/>
    <text x="60" y="275">Pricing SMS · discount</text>
    <rect x="48" y="300" width="240" height="40" rx="8" fill="#fff" stroke="#D6D3D1"/>
    <text x="60" y="325">Checkout modal · interruption</text>
    <rect x="48" y="350" width="240" height="40" rx="8" fill="#fff" stroke="#D6D3D1"/>
    <text x="60" y="375">Support agent · reminder</text>
  </g>
  <path d="M310 300 H390" stroke="#A8A29A" stroke-width="2"/>
  <circle cx="440" cy="300" r="42" fill="#0B0B0F"/>
  <text x="440" y="296" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F5F0" font-weight="700">User</text>
  <text x="440" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#E8A317">overwhelmed</text>
  <text x="340" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#B45309">Pressure stacks. No shared stop.</text>

  <line x1="560" y1="140" x2="560" y2="480" stroke="#D6D3D1" stroke-width="2"/>

  <!-- With -->
  <text x="600" y="160" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B0B0F">With SoftStop</text>
  <text x="600" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#78716C">Same intents — one check before execute</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#44403C">
    <rect x="600" y="200" width="220" height="40" rx="8" fill="#fff" stroke="#D6D3D1"/>
    <text x="612" y="225">Lifecycle email · urgency</text>
    <rect x="600" y="250" width="220" height="40" rx="8" fill="#fff" stroke="#D6D3D1"/>
    <text x="612" y="275">Pricing SMS · discount</text>
    <rect x="600" y="300" width="220" height="40" rx="8" fill="#fff" stroke="#D6D3D1"/>
    <text x="612" y="325">Checkout modal · interrupt</text>
  </g>
  <path d="M840 270 H900" stroke="#A8A29A" stroke-width="2"/>
  <rect x="900" y="230" width="72" height="88" rx="12" fill="#0B0B0F"/>
  <text x="936" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#F7F5F0" font-weight="700">SoftStop</text>
  <rect x="912" y="274" width="48" height="8" rx="4" fill="#E8A317"/>
  <text x="936" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#A8A29A">check</text>
  <path d="M990 274 H1040" stroke="#A8A29A" stroke-width="2"/>
  <circle cx="1090" cy="274" r="34" fill="#0B0B0F"/>
  <text x="1090" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#F7F5F0" font-weight="700">User</text>
  <text x="1090" y="286" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#10B981">protected</text>
  <text x="700" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#047857">Only allowed escalations pass.</text>

  <text x="48" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#78716C">Example story on softstop.vercel.app: scroll marketing chaos across email, SMS, push, in-app — then toggle SoftStop on.</text>
</svg>