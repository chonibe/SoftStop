# SoftStop on Fly.io — memory storage by default (ephemeral; fine for eval).
# Deploy:
#   fly launch --copy-config   # first time (creates app, may prompt for name)
#   fly deploy
# Or open the README “Deploy to Fly” link (uses this Dockerfile + config).
#
# Persistence: set SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY as Fly secrets and
# remove or override GOVERNOR_STORAGE=memory.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  GOVERNOR_STORAGE = "memory"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
