# Governor Tenet Check v2.0
# 
# Governor governs itself.
# This workflow enforces TENETS.md on every PR.
# 
# BYPASS POLICY: The ONLY way to bypass is to modify tenet-policy.json.
# That change requires CODEOWNERS approval and is visible in git history.

name: Tenet Check

on:
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================================
  # SELF-VERIFICATION: Ensure enforcement hasn't been tampered with
  # ============================================================================
  integrity-check:
    name: Verify Enforcement Integrity
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify tenet-check.js integrity
        run: |
          echo "Verifying tenet-check.js hasn't been neutered..."
          
          REQUIRED_MARKERS=(
            "FORBIDDEN_IMPORT"
            "FORBIDDEN_FUNCTION"
            "TENET_VIOLATION"
            "TENET CHECK FAILED"
            "DYNAMIC_IMPORT_EVASION"
          )
          
          for marker in "${REQUIRED_MARKERS[@]}"; do
            if ! grep -q "$marker" scripts/tenet-check.js; then
              echo "❌ INTEGRITY CHECK FAILED"
              echo "   tenet-check.js is missing required marker: $marker"
              echo "   This indicates the enforcement script has been tampered with."
              exit 1
            fi
          done
          
          echo "✅ tenet-check.js integrity verified"
      
      - name: Verify tenet-policy.json exists and is valid
        run: |
          echo "Verifying tenet-policy.json..."
          
          if [ ! -f tenet-policy.json ]; then
            echo "❌ tenet-policy.json is missing!"
            exit 1
          fi
          
          # Verify it's valid JSON
          if ! node -e "JSON.parse(require('fs').readFileSync('tenet-policy.json'))"; then
            echo "❌ tenet-policy.json is not valid JSON!"
            exit 1
          fi
          
          # Verify it has required sections
          if ! node -e "const p = JSON.parse(require('fs').readFileSync('tenet-policy.json')); if (!p.surfaces || !p.surfaces.core) { process.exit(1); }"; then
            echo "❌ tenet-policy.json is missing required sections!"
            exit 1
          fi
          
          echo "✅ tenet-policy.json is valid"

  # ============================================================================
  # GOVERNANCE FILE CHANGE DETECTION
  # ============================================================================
  governance-check:
    name: Detect Governance Changes
    runs-on: ubuntu-latest
    outputs:
      governance_modified: ${{ steps.check.outputs.governance_modified }}
      modified_files: ${{ steps.check.outputs.modified_files }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for governance file changes
        id: check
        run: |
          echo "Checking for governance file modifications..."
          
          GOVERNANCE_FILES=(
            "TENETS.md"
            "tenet-policy.json"
            "scripts/tenet-check.js"
            ".github/workflows/tenet-check.yml"
            ".github/CODEOWNERS"
          )
          
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          MODIFIED_GOVERNANCE=""
          
          for gov_file in "${GOVERNANCE_FILES[@]}"; do
            if echo "$CHANGED_FILES" | grep -q "$gov_file"; then
              MODIFIED_GOVERNANCE="$MODIFIED_GOVERNANCE $gov_file"
            fi
          done
          
          if [ -n "$MODIFIED_GOVERNANCE" ]; then
            echo "governance_modified=true" >> $GITHUB_OUTPUT
            echo "modified_files=$MODIFIED_GOVERNANCE" >> $GITHUB_OUTPUT
            
            echo ""
            echo "╔═══════════════════════════════════════════════════════════╗"
            echo "║  ⚠️  GOVERNANCE FILES MODIFIED                             ║"
            echo "╚═══════════════════════════════════════════════════════════╝"
            echo ""
            echo "The following governance files have been modified:"
            for f in $MODIFIED_GOVERNANCE; do
              echo "  - $f"
            done
            echo ""
            echo "This change REQUIRES CODEOWNERS approval."
            echo "This is the ONLY legitimate way to bypass tenet checks."
            echo "The change will be visible in git history."
            echo ""
          else
            echo "governance_modified=false" >> $GITHUB_OUTPUT
            echo "modified_files=" >> $GITHUB_OUTPUT
            echo "✅ No governance files modified"
          fi

  # ============================================================================
  # CORE TENET CHECK
  # ============================================================================
  tenet-check:
    name: Verify Tenet Compliance
    runs-on: ubuntu-latest
    needs: [integrity-check]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Get changed files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx|js|jsx)$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          CORE_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(governor/(api/src|core)|packages/(api|core))/' || true)
          if [ -n "$CORE_CHANGED" ]; then
            echo "core_changed=true" >> $GITHUB_OUTPUT
            echo "Core files changed:"
            echo "$CORE_CHANGED"
          else
            echo "core_changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run tenet check on changed files
        if: steps.changed-files.outputs.files != ''
        run: |
          FILES=$(echo "${{ steps.changed-files.outputs.files }}" | tr '\n' ',' | sed 's/,$//')
          
          if [ -n "$FILES" ]; then
            node scripts/tenet-check.js --files "$FILES" --verbose
          fi
      
      - name: Run full tenet check
        run: |
          echo "Running full tenet check on all Core files..."
          node scripts/tenet-check.js --all

  # ============================================================================
  # DEPENDENCY DIRECTION CHECK
  # ============================================================================
  dependency-check:
    name: Check Dependency Direction
    runs-on: ubuntu-latest
    needs: [integrity-check]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Core does not import Ecosystem
        run: |
          echo "Checking that Core does not import from Ecosystem..."
          
          VIOLATIONS=$(grep -r -n "from.*ecosystem\|from.*gateway\|from.*sendgrid\|from.*twilio\|from.*postmark\|from.*mailchimp\|from.*nodemailer\|from.*resend" governor/api/src/ packages/api/src/ 2>/dev/null || true)
          
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ TENET VIOLATION: Core imports from Ecosystem or external senders"
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "To bypass: Modify tenet-policy.json (requires CODEOWNERS approval)"
            exit 1
          else
            echo "✅ No forbidden imports found in Core"
          fi
      
      - name: Check for dynamic import evasion
        run: |
          echo "Checking for dynamic import evasion attempts..."
          
          # Look for suspicious patterns
          EVASION=$(grep -r -n -E "await\s+import\s*\(|require\s*\([^'\"]|eval\s*\(" governor/api/src/ packages/api/src/ 2>/dev/null | grep -v "node_modules" || true)
          
          if [ -n "$EVASION" ]; then
            echo "⚠️ POTENTIAL DYNAMIC IMPORT EVASION DETECTED"
            echo ""
            echo "$EVASION"
            echo ""
            echo "Dynamic imports may be used to evade static analysis."
            echo "Review these carefully."
          else
            echo "✅ No dynamic import evasion detected"
          fi

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Tenet Check Summary
    runs-on: ubuntu-latest
    needs: [integrity-check, governance-check, tenet-check, dependency-check]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║          GOVERNOR TENET CHECK SUMMARY                    ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          
          FAILED=false
          
          if [ "${{ needs.integrity-check.result }}" == "failure" ]; then
            echo "❌ Integrity Check: FAILED (enforcement may be tampered)"
            FAILED=true
          else
            echo "✅ Integrity Check: PASSED"
          fi
          
          if [ "${{ needs.governance-check.outputs.governance_modified }}" == "true" ]; then
            echo "⚠️ Governance Check: FILES MODIFIED (requires CODEOWNERS)"
            echo "   Modified: ${{ needs.governance-check.outputs.modified_files }}"
          else
            echo "✅ Governance Check: No changes"
          fi
          
          if [ "${{ needs.tenet-check.result }}" == "failure" ]; then
            echo "❌ Tenet Check: FAILED"
            FAILED=true
          else
            echo "✅ Tenet Check: PASSED"
          fi
          
          if [ "${{ needs.dependency-check.result }}" == "failure" ]; then
            echo "❌ Dependency Check: FAILED"
            FAILED=true
          else
            echo "✅ Dependency Check: PASSED"
          fi
          
          echo ""
          
          if [ "$FAILED" == "true" ]; then
            echo "═══════════════════════════════════════════════════════════"
            echo "❌ OVERALL: TENET CHECK FAILED"
            echo ""
            echo "This PR violates Governor's Core Tenets."
            echo ""
            echo "To resolve violations:"
            echo "  1. Move execution logic to governor/ecosystem/"
            echo "  2. Remove forbidden imports from Core"
            echo "  3. See TENETS.md for full policy"
            echo ""
            echo "To bypass legitimately:"
            echo "  Modify tenet-policy.json (requires CODEOWNERS approval)"
            echo "═══════════════════════════════════════════════════════════"
            exit 1
          else
            echo "═══════════════════════════════════════════════════════════"
            echo "✅ OVERALL: TENET CHECK PASSED"
            echo ""
            echo "Governor governs itself."
            echo "═══════════════════════════════════════════════════════════"
          fi
